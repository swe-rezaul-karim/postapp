name: CI/CD Pipeline - Build, Push Images and Deployed

on:
  push:
    branches:
      - main
  pull_request:

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/post-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/post-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test
  
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push, test]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Debug - list all files
        run: |
          pwd
          ls -R

      - name: Deploy with kubectl
        run: |
          kubectl apply -f config/configmap.yml
          kubectl apply -f config/secret.yml
          kubectl apply -f config/frontend-config.yml
          kubectl apply -f postgres/deployment.yml
          kubectl apply -f postgres/service.yml
          kubectl apply -f backend/deployment.yml
          kubectl apply -f backend/service.yml
          kubectl apply -f frontend/deployment.yml
          kubectl apply -f frontend/service.yml
          kubectl apply -f ingress/ingress.yml
